<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Stock - Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="logo"></span>Acme Stock</a>
    <nav class="nav">
      <a class="active" href="index.html">Dashboard</a>
      <a href="inventory.html" id="nav-inventory">Inventory</a>
      <a href="reports.html">Reports</a>
    </nav>
    <div class="spacer"></div>
    <div class="user"><span class="avatar">JD</span> Jane Doe</div>
  </div>
  <main>
    <h1>Welcome back, Jane</h1>
    <p class="sub">Here is what is happening in your warehouse today.</p>
    <div class="cards">
      <div class="card"><div class="label">Items in stock</div><div class="value">1,284</div><div class="delta">+4.2% this week</div></div>
      <div class="card"><div class="label">Open orders</div><div class="value">36</div><div class="delta">+12 today</div></div>
      <div class="card"><div class="label">Low stock</div><div class="value">7</div><div class="delta">3 need reorder</div></div>
      <div class="card"><div class="label">Revenue (30d)</div><div class="value">$48.2k</div><div class="delta">+8.1%</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Quick actions</h2></div>
      <a class="btn" href="inventory.html" id="go-inventory">Open inventory</a>
      <a class="btn ghost" href="reports.html">View reports</a>
    </div>
  </main>
  <script src="chat-loader.js"></script>
</body>
</html>

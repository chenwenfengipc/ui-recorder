<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Sign in</title><link rel="stylesheet" href="style.css" /></head>
<body>
  <main style="max-width:420px">
    <div class="panel">
      <h2>Sign in</h2>
      <!-- deliberately unlabeled: no label, placeholder, name or id text to fall back on -->
      <input type="password" style="width:100%;padding:10px;margin:8px 0" />
      <input type="text" style="width:100%;padding:10px;margin:8px 0" />
      <input type="submit" value="Log in" class="btn" />
    </div>
  </main>
</body>
</html>

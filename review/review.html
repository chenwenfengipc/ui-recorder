<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review captured steps</title>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="titles">
        <h1>Review captured steps</h1>
        <p id="summary" class="summary">Loading…</p>
      </div>
      <div class="actions">
        <button id="discardBtn" type="button" class="btn btn-ghost">Discard all</button>
        <button id="generateBtn" type="button" class="btn btn-primary" disabled>Generate guide</button>
      </div>
    </header>

    <main>
      <p id="hint" class="hint" hidden>
        Drag a card (or use the arrows) to change its position. Click a screenshot to view it full size. Nothing is
        saved or uploaded until you press <strong>Generate guide</strong>.
      </p>
      <p id="error" class="error" role="alert" hidden></p>
      <ol id="steps" class="steps"></ol>

      <section id="done" class="done" hidden>
        <h2 id="doneTitle"></h2>
        <p id="doneText"></p>
        <button id="closeBtn" type="button" class="btn btn-primary">Close this tab</button>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toastText"></span>
      <button id="undoBtn" type="button">Undo</button>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <img id="lightboxImg" alt="" />
    </div>

    <script src="review.js"></script>
  </body>
</html>
